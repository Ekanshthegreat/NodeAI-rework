name: Validate MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the bridge without ROS
        env:
          PYTHONPATH: ros2/nodeai_bridge
        run: |
          for suite in gateway transport audit health; do
            python3 -m unittest discover -s ros2/nodeai_bridge/test -p "test_${suite}.py"
          done
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  ros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS Jazzy package
        run: docker build -f ros2/Dockerfile -t nodeai-ros-test .
      - name: Test real ROS actions and bridge transport
        run: docker run --rm nodeai-ros-test
