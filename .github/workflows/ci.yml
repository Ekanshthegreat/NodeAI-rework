name: Validate MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  ros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS Jazzy package
        run: docker build -f ros2/Dockerfile -t nodeai-ros-test .
      - name: Test real ROS actions and bridge transport
        run: docker run --rm nodeai-ros-test
